services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-contractiq}
      MYSQL_USER: ${MYSQL_USER:-contractiq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contractiq-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-local-root-password}
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:29092:29092"]
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
  object-store-permissions:
    image: alpine:3.21
    command: ["sh", "-c", "chown -R 10001:10001 /data0 /data1 /data2 /data3"]
    volumes:
      - rustfs-data-0:/data0
      - rustfs-data-1:/data1
      - rustfs-data-2:/data2
      - rustfs-data-3:/data3
  object-store:
    image: rustfs/rustfs:1.0.4
    depends_on:
      object-store-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-contractiq}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend/.env}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: [qdrant-data:/qdrant/storage]
  ollama:
    image: ollama/ollama:0.6.2
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama-data:/root/.ollama]
  app:
    build: .
    profiles: ["application"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-contractiq}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: ${MYSQL_USER:-contractiq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contractiq-local-only}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env before starting the application}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES: com.contractiq.contracts
      SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_POLL_INTERVAL_MS: ${KAFKA_MAX_POLL_INTERVAL_MS:-900000}
      SPRING_KAFKA_CONSUMER_PROPERTIES_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-1}
      MINIO_ENDPOINT: http://object-store:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-contractiq}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend/.env before starting the application}
      QDRANT_ENDPOINT: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      TESSERACT_BINARY: ${TESSERACT_BINARY:-tesseract}
      TESSERACT_LANGUAGES: ${TESSERACT_LANGUAGES:-eng}
      TESSERACT_TIMEOUT_SECONDS: ${TESSERACT_TIMEOUT_SECONDS:-60}
      BREVO_EMAIL_ENABLED: ${BREVO_EMAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-ContractIQ}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      object-store:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
volumes:
  mysql-data:
  redis-data:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
  qdrant-data:
  ollama-data:
